# Headlamp on the shared Gateway:
#
#   http://headlamp.172.17.10.29.nip.io/
#
# nip.io is public wildcard DNS: <anything>.<ip>.nip.io resolves to <ip>, so
# no DNS entry is needed. If the Gateway's VIP changes, change the hostname
# here AND in the add-on (supervisor/.../se-cluster-01-addons/headlamp/).
#
# The namespace `headlamp` is created and owned by the add-on; nothing here
# declares it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  parentRefs:
  - name: public
    namespace: istio-ingress
  # A hostname makes this route win over the demo's catch-all "/" route for
  # this host (Gateway API prefers the most specific hostname).
  hostnames:
  - headlamp.172.17.10.29.nip.io
  rules:
  - backendRefs:
    - name: headlamp
      port: 443
---
# Headlamp only speaks HTTPS (see the add-on file). This tells the Gateway's
# Envoy to open TLS to it rather than plain HTTP.
#
# insecureSkipVerify: Headlamp's certificate is self-signed by its own
# per-install CA (headlamp-issuer), generated at runtime, so there is no CA
# to pin in git. The hop is still encrypted; it is just not verified. The
# stricter alternative is a Gateway API BackendTLSPolicy with that CA copied
# into a ConfigMap (e.g. by cert-manager trust-manager).
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: headlamp-backend-tls
  namespace: headlamp
spec:
  host: headlamp.headlamp.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      sni: headlamp.172.17.10.29.nip.io
      insecureSkipVerify: true
