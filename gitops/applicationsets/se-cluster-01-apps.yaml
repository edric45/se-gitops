# One ArgoCD Application per folder under clusters/se-cluster-01/ -- things
# deployed INSIDE the workload cluster by ArgoCD itself (not VKS add-ons,
# which are declared on the Supervisor; see se-cluster-01-addons.yaml).
#
#   kubectl --context se-ns-argo apply -f gitops/applicationsets/
#
# Apps are named se-cluster-01-app-<folder> (the -app- keeps them from
# colliding with add-on apps, which are se-cluster-01-<addon>).
#
#   add a folder, push     -> app created and synced automatically
#   delete a folder, push  -> app and everything it deployed are removed
#
# Each folder must declare its own Namespace(s); the destination namespace
# below only applies to objects that do not set one.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: se-cluster-01-apps
  namespace: se-ns-argo
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/edric45/se-gitops.git
      revision: main
      directories:
      - path: clusters/se-cluster-01/*
  template:
    metadata:
      name: 'se-cluster-01-app-{{ .path.basename }}'
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      labels:
        cluster: se-cluster-01
        kind: in-cluster
    spec:
      project: se-cluster-01
      source:
        repoURL: https://github.com/edric45/se-gitops.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        name: se-cluster-01
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
